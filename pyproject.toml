[project]
name = "rapidaudit"
version = "0.1.0"
description = "RAPID challenge audits (participant counts) on the All of Us Workbench"
requires-python = ">=3.10"
# google-cloud-bigquery is NOT listed: audits run on the Workbench VM's own Python,
# which ships it. Local tests fake BigQuery.
dependencies = ["pandas"]

[dependency-groups]
dev = [
    "pytest",
    "sqlglot>=30.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
